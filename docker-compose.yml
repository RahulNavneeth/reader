# Reader — self-hosted knowledge platform.
# All state on disk; no DB. Three services: app + S3-compatible blob store + local embeddings.
#
# Quick start:
#   1. cp .env.example .env  (and set SESSION_SECRET to a long random string)
#   2. docker compose up -d
#   3. open http://localhost:3001 — first signup becomes admin
#   4. (one-time) docker compose exec ollama ollama pull nomic-embed-text
#
# Volumes are bind-mounted to ./_state/* so you can rsync them to a NAS.

services:
  app:
    build: .
    image: reader:local
    container_name: reader-app
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-3001}:3001"
    environment:
      DATA_DIR: /data
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3001
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env (>= 32 chars)}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      ALLOW_OPEN_SIGNUP: ${ALLOW_OPEN_SIGNUP:-false}
      READER_ROOT: /data/legacy-root
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-104857600}
      # Storage — point at MinIO sibling.
      STORAGE: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-reader}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-readeradmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      S3_FORCE_PATH_STYLE: "true"
      # Embeddings — point at Ollama sibling.
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_ENABLED: "true"
    volumes:
      - ./_state/data:/data
    depends_on:
      minio:
        condition: service_healthy
      ollama:
        condition: service_started

  minio:
    image: minio/minio:latest
    container_name: reader-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-readeradmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ./_state/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: reader-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ./_state/ollama:/root/.ollama
    # On Apple Silicon and CUDA-equipped hosts, pass-through GPU resources here.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
