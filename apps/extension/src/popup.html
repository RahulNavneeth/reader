<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reader — Capture</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #172b4d;
        --muted: #6b778c;
        --accent: #0052cc;
        --border: #dfe1e6;
        --danger: #de350b;
        --ok: #006644;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1424;
          --fg: #e8ecf3;
          --muted: #97a1b7;
          --accent: #4c9aff;
          --border: #1e2c49;
        }
      }
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
        font-size: 13px;
        background: var(--bg);
        color: var(--fg);
        margin: 0;
        width: 340px;
        padding: 12px;
      }
      h1 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
      .title { font-weight: 600; font-size: 13.5px; margin-bottom: 4px; max-height: 36px; overflow: hidden; }
      .url { color: var(--muted); font-size: 11.5px; max-height: 28px; overflow: hidden; }
      button { font: inherit; cursor: pointer; border: none; border-radius: 4px; padding: 6px 10px; }
      .primary { background: var(--accent); color: white; width: 100%; padding: 8px 12px; font-weight: 600; margin-top: 10px; }
      .primary:disabled { opacity: 0.5; cursor: default; }
      .link { background: transparent; color: var(--muted); padding: 4px 6px; font-size: 11.5px; }
      .link:hover { color: var(--fg); }
      .row { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: 6px; }
      label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
      input { width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--fg); font: inherit; font-size: 12.5px; }
      .form { margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--border); }
      .form > div + div { margin-top: 8px; }
      .status { margin-top: 8px; font-size: 11.5px; min-height: 14px; }
      .status.ok { color: var(--ok); }
      .status.err { color: var(--danger); }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <h1>Capture into Reader</h1>
    <div class="title" id="page-title">…</div>
    <div class="url" id="page-url">…</div>
    <button class="primary" id="capture">Capture this page</button>
    <div class="status" id="status"></div>

    <div class="row">
      <button class="link" id="toggle-settings">⚙ Settings</button>
    </div>
    <div class="form hidden" id="settings">
      <div>
        <label for="server">Server URL</label>
        <input id="server" placeholder="https://docs.example.com" />
      </div>
      <div>
        <label for="token">API token</label>
        <input id="token" type="password" placeholder="rkn_…" />
      </div>
      <div class="row">
        <button class="primary" id="save" style="margin-top: 8px;">Save</button>
      </div>
    </div>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
