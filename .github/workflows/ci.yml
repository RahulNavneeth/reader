name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

  docker-build-smoke:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build single-arch (native, ~3 min) so PRs get fast feedback
      # that the Dockerfile still works. Multi-arch + push happens
      # on the release workflow (tag pushes), not on every PR.
      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: reader:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot + healthcheck
        run: |
          docker run -d --name reader-ci -p 3099:3001 \
            -e SESSION_SECRET=ci-session-secret-thats-32-chars-or-more \
            -e APP_URL=http://localhost:3099 \
            reader:ci

          # Poll /health for up to 30s.
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3099/health > /dev/null; then
              echo "ready after ${i}s"
              break
            fi
            sleep 1
          done

          curl -sf http://127.0.0.1:3099/health || (docker logs reader-ci; exit 1)
          docker stop reader-ci
